name: Build APK
on: workflow_dispatch

env:
npm_config_legacy_peer_deps: "true"

jobs:
apk:
runs-on: ubuntu-latest
timeout-minutes: 60
steps:
- uses: actions/checkout@v4
- uses: actions/setup-node@v4
with:
node-version: 22
- uses: actions/setup-java@v4
with:
distribution: temurin
java-version: 17
- name: Unpack project
run: unzip -q -o lfr-tune.zip -d app
- name: Install and align versions
working-directory: app
run: |
npm install
npx expo install --fix
- name: Type check (informational)
working-directory: app
continue-on-error: true
run: npx tsc --noEmit
- name: Generate Android project
working-directory: app
run: npx expo prebuild --platform android --no-install
- name: Build APK
working-directory: app/android
run: |
chmod +x gradlew
./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
- uses: actions/upload-artifact@v4
with:
name: LFR-Tune-apk
path: app/android/app/build/outputs/apk/release/app-release.apk
